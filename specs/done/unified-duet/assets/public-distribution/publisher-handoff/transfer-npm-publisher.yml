name: Transfer Duet npm publishing ownership

on:
  push:
    branches: [codex/duet-publisher-handoff]

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the GitHub secret encryption dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pynacl==1.6.2
      - name: Verify the handoff with disposable credentials
        run: python -I scripts/seal-publisher-secret.test.py
      - name: Seal the existing credential for its new repository
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DESTINATION_KEY_ID: '3380204578043523366'
          DESTINATION_PUBLIC_KEY: 'w3cef5a49iaQZ1qCTB6++qLr+lJRTdSrKaoChE3bx2k='
        run: python -I scripts/seal-publisher-secret.py
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-npm-publisher
          path: publisher-secret.json
          if-no-files-found: error
          retention-days: 1
