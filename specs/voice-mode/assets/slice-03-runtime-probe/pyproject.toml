[project]
name = "duet-voice-runtime-probe"
version = "0.0.0"
description = "Disposable evidence probe for Voice mode Slice 03"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp==3.14.4",
  "av==18.0.0",
  "livekit-agents[mcp]==1.6.7",
  "mcp==1.29.0",
  "playwright==1.62.0",
]

[dependency-groups]
dev = ["mypy==2.3.0", "pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.1"]

[project.scripts]
voice-runtime-probe = "voice_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_probe"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["voice_probe"]
